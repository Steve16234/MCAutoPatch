name: Build APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install build-tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "build-tools;34.0.0"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          AAPT2_SOURCE="$BUILD_TOOLS/aapt2"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          echo "AAPT2_SOURCE=$AAPT2_SOURCE"

          if [ ! -f "$AAPT2_SOURCE" ]; then
            echo "[x] 找不到 aapt2: $AAPT2_SOURCE"
            exit 1
          fi

          # 不修改 Android SDK 原始 aapt2
          # 复制到 GitHub Workspace 后再设置执行权限
          mkdir -p "$GITHUB_WORKSPACE/build_work/_tools"

          AAPT2_LOCAL="$GITHUB_WORKSPACE/build_work/_tools/aapt2"

          cp "$AAPT2_SOURCE" "$AAPT2_LOCAL"
          chmod 755 "$AAPT2_LOCAL"

          if [ ! -x "$AAPT2_LOCAL" ]; then
            echo "[x] 本地 aapt2 无法执行"
            ls -la "$GITHUB_WORKSPACE/build_work/_tools"
            exit 1
          fi

          echo "=== Local AAPT2 ==="
          ls -la "$AAPT2_LOCAL"

          "$AAPT2_LOCAL" version

          # 提供给 AutoBuild.py
          echo "AAPT2_PATH=$AAPT2_LOCAL" >> "$GITHUB_ENV"

          # 加入 PATH
          echo "$GITHUB_WORKSPACE/build_work/_tools" >> "$GITHUB_PATH"

      - name: Install apktool 2.11.1
        shell: bash
        run: |
          set -euo pipefail

          wget -q -O /usr/local/bin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar"

          printf '%s\n' \
            '#!/bin/bash' \
            'exec java -jar /usr/local/bin/apktool.jar "$@"' \
            | sudo tee /usr/local/bin/apktool > /dev/null

          sudo chmod 755 /usr/local/bin/apktool

          apktool --version

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: |
            state.json
            so_patch/
          key: apk-state-${{ github.run_id }}
          restore-keys: |
            apk-state-

      - name: Build
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SO_REPO: ${{ vars.SO_REPO }}
          SO_RELEASE: latest
          SO_TOKEN: ${{ secrets.SO_TOKEN }}
          AAPT2_PATH: ${{ env.AAPT2_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Build environment ==="
          echo "AAPT2_PATH=$AAPT2_PATH"

          if [ ! -x "$AAPT2_PATH" ]; then
            echo "[x] AAPT2 不存在或不可执行"
            exit 1
          fi

          "$AAPT2_PATH" version

          python AutoBuild.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            state.json
            so_patch/
          key: apk-state-${{ github.run_id }}

      - name: Publish stable
        if: steps.build.outputs.apk_paths_stable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag_stable }}
          name: MC Patch (正式版) ${{ steps.build.outputs.release_tag_stable }}
          body: |
            自动构建的 MC 正式版补丁 APK

            - Channel: `stable` (b=0)
            - 触发时间: ${{ github.run_started_at }}
          files: dist/stable/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Publish beta
        if: steps.build.outputs.apk_paths_beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag_beta }}
          name: MC Patch (测试版) ${{ steps.build.outputs.release_tag_beta }}
          body: |
            自动构建的 MC 测试版补丁 APK

            - Channel: `beta` (b=1)
            - 触发时间: ${{ github.run_started_at }}
          files: dist/beta/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
