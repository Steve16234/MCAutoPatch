name: Build APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "build-tools;34.0.0"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          AAPT2_SOURCE="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          LOCAL_TOOLS="$GITHUB_WORKSPACE/build_work/_tools"

          test -f "$AAPT2_SOURCE"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          mkdir -p "$LOCAL_TOOLS"

          # 不修改 Android SDK 原始 aapt2 的权限，只复制到 workspace。
          cp "$AAPT2_SOURCE" "$LOCAL_TOOLS/aapt2"
          chmod 755 "$LOCAL_TOOLS/aapt2"

          echo '=== pinned Android tools ==='
          "$LOCAL_TOOLS/aapt2" version
          "$APKSIGNER" version
          "$ZIPALIGN" -h | head -3 || true

          echo "BUILD_TOOLS_VERSION=34.0.0" >> "$GITHUB_ENV"
          echo "AAPT2_PATH=$LOCAL_TOOLS/aapt2" >> "$GITHUB_ENV"
          echo "APKSIGNER_PATH=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ZIPALIGN_PATH=$ZIPALIGN" >> "$GITHUB_ENV"

          # 固定 34.0.0 工具目录优先于 runner 预装的其它版本。
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Install Apktool 2.11.1
        shell: bash
        run: |
          set -euo pipefail
          wget -q -O /usr/local/bin/apktool.jar \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          printf '%s\n' '#!/bin/bash' \
            'exec java -jar /usr/local/bin/apktool.jar "$@"' \
            | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod 755 /usr/local/bin/apktool
          apktool --version

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: |
            state.json
            so_patch/
          key: apk-state-${{ github.run_id }}
          restore-keys: |
            apk-state-

      - name: Build
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SO_REPO: ${{ vars.SO_REPO }}
          SO_RELEASE: latest
          SO_TOKEN: ${{ secrets.SO_TOKEN }}
          AAPT2_PATH: ${{ env.AAPT2_PATH }}
          APKSIGNER_PATH: ${{ env.APKSIGNER_PATH }}
          ZIPALIGN_PATH: ${{ env.ZIPALIGN_PATH }}
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Build environment ==='
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION"
          echo "AAPT2_PATH=$AAPT2_PATH"
          echo "APKSIGNER_PATH=$APKSIGNER_PATH"
          echo "ZIPALIGN_PATH=$ZIPALIGN_PATH"

          test -x "$AAPT2_PATH"
          test -x "$APKSIGNER_PATH"
          test -x "$ZIPALIGN_PATH"

          "$AAPT2_PATH" version
          "$APKSIGNER_PATH" version

          python AutoBuild.py

      - name: Upload failed signing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signing-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            dist/**/*.signed.tmp.apk
            build_work/**/aligned.apk
          retention-days: 1

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            state.json
            so_patch/
          key: apk-state-${{ github.run_id }}

      - name: Publish stable
        if: steps.build.outputs.apk_paths_stable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag_stable }}
          name: MC Patch (正式版) ${{ steps.build.outputs.release_tag_stable }}
          body: |
            自动构建的 MC 正式版补丁 APK
            - Channel: `stable` (b=0)
            - 触发时间: ${{ github.run_started_at }}
          files: dist/stable/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Publish beta
        if: steps.build.outputs.apk_paths_beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag_beta }}
          name: MC Patch (测试版) ${{ steps.build.outputs.release_tag_beta }}
          body: |
            自动构建的 MC 测试版补丁 APK
            - Channel: `beta` (b=1)
            - 触发时间: ${{ github.run_started_at }}
          files: dist/beta/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
