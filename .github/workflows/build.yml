name: Build APK

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 忽略版本状态，强制重新构建并签名
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_TOOLS_VERSION: '34.0.0'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check build script syntax
        run: python -m py_compile AutoBuild.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "build-tools;$BUILD_TOOLS_VERSION"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          AAPT2_SOURCE="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          LOCAL_TOOLS="$GITHUB_WORKSPACE/build_work/_tools"

          test -f "$AAPT2_SOURCE"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          mkdir -p "$LOCAL_TOOLS"

          # 不修改 Android SDK 原始 aapt2 的权限，只复制到 workspace。
          cp "$AAPT2_SOURCE" "$LOCAL_TOOLS/aapt2"
          chmod 755 "$LOCAL_TOOLS/aapt2"

          echo '=== pinned Android tools ==='
          "$LOCAL_TOOLS/aapt2" version
          "$APKSIGNER" version
          "$ZIPALIGN" -h | head -3 || true

          echo "AAPT2_PATH=$LOCAL_TOOLS/aapt2" >> "$GITHUB_ENV"
          echo "APKSIGNER_PATH=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ZIPALIGN_PATH=$ZIPALIGN" >> "$GITHUB_ENV"

          # 固定 34.0.0 工具目录优先于 runner 预装的其它版本。
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Install Apktool 2.11.1
        shell: bash
        run: |
          set -euo pipefail
          wget -q -O /usr/local/bin/apktool.jar \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          printf '%s\n' '#!/bin/bash' \
            'exec java -jar /usr/local/bin/apktool.jar "$@"' \
            | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod 755 /usr/local/bin/apktool
          apktool --version

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: |
            state.json
            so_patch/
          key: apk-state-v2-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apk-state-v2-${{ github.ref }}-

      - name: Force rebuild
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
        run: python -c "from pathlib import Path; Path('state.json').unlink(missing_ok=True)"

      - name: Build
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SO_REPO: ${{ vars.SO_REPO }}
          SO_RELEASE: latest
          SO_TOKEN: ${{ secrets.SO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Build environment ==='
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION"
          echo "AAPT2_PATH=$AAPT2_PATH"
          echo "APKSIGNER_PATH=$APKSIGNER_PATH"
          echo "ZIPALIGN_PATH=$ZIPALIGN_PATH"

          test -x "$AAPT2_PATH"
          test -x "$APKSIGNER_PATH"
          test -x "$ZIPALIGN_PATH"

          "$AAPT2_PATH" version
          "$APKSIGNER_PATH" version

          # pipefail 保留 Python 的失败状态，同时保存完整签名/验签日志。
          python AutoBuild.py 2>&1 | tee build.log

      - name: Upload failed signing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signing-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            build.log
            dist/**/*.signed.tmp.apk
            build_work/**/aligned.apk
          retention-days: 1

      - name: Publish stable
        if: steps.build.outputs.apk_paths_stable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag_stable }}
          name: MC Patch (正式版) ${{ steps.build.outputs.release_tag_stable }}
          body: |
            自动构建的 MC 正式版补丁 APK
            - Channel: `stable` (b=0)
            - 构建记录: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 签名验证: V1 / V2 / V3
          files: dist/stable/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}

      - name: Publish beta
        if: steps.build.outputs.apk_paths_beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag_beta }}
          name: MC Patch (测试版) ${{ steps.build.outputs.release_tag_beta }}
          body: |
            自动构建的 MC 测试版补丁 APK
            - Channel: `beta` (b=1)
            - 构建记录: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 签名验证: V1 / V2 / V3
          files: dist/beta/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}

      # 构建及发布均成功后才保存状态，避免失败产物在下次运行时被跳过。
      - name: Save state after publishing
        if: ${{ success() && (steps.build.outputs.apk_paths_stable || steps.build.outputs.apk_paths_beta) }}
        uses: actions/cache/save@v5
        with:
          path: |
            state.json
            so_patch/
          key: apk-state-v2-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
